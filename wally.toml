[package]
name = "greenviper126/vluxyai"

description = """
Simple, composable AI for Roblox: a state table, a pathfinder, a mover and some senses, stacked with a builder.

Source: https://github.com/Vlux-Entertainment/VluxyAI
"""
version = "0.2.1"
license = "MIT"
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"

include = ["lib", "default.project.json", "LICENSE", "README.md"]

exclude = [
    "examples",
    "tests",
    "docs",
    "build",
    "Art",
    "Commands",
    "PackageTests",
    "CLAUDE.md",
    "PLAN.md",
    "rokit.toml",
    "moonwave.toml",
    "stylua.toml",
    "selene.toml",
    "sourcemap.json",
    "test-place.project.json",
    ".vscode",
    ".moonwave",
    ".luau-analyze",
    ".gitignore",
]

