[[home.features]]
title = "A brain is a table"
description = "States with Enter, Update, Exit and ordered transitions. The whole AI reads top to bottom, and a bad field fails at Build() with its path."

[[home.features]]
title = "Senses write, states read"
description = "Sight, hearing, proximity and being-watched write a blackboard every tick. States never raycast, so brains stay readable and run headless."

[[home.features]]
title = "Contracts, not registries"
description = "A pathfinder is anything with FindPath, a mover anything with Follow and Stop. Pass your own in; the package never learns it exists."
